<!doctype html>
<html lang="en-GB"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>FU£L · owner</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<!-- The owner's private numbers. The page is public but holds nothing: every figure comes from the owner_stats() database function
     (supabase/owner-dashboard.sql), which only answers the signed-in email listed in app_owners. Anyone else gets "not allowed". -->
<style>
:root { --bg:#fffbf2; --panel:#fff; --line:#ffe3a3; --text:#1b1a2e; --muted:#6b6785; --pink:#ff4f7b; --sun:#ffc531; --lime:#7be34a; --sky:#38c6ff; --grape:#9b5cff; --navy:#1b1a2e; }
* { box-sizing: border-box; } html, body { margin: 0; background: linear-gradient(180deg, #fff1c2 0, var(--bg) 320px); color: var(--text); font: 16px/1.45 Inter, -apple-system, sans-serif; min-height: 100%; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 22px 18px 60px; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; } .mark { font: 800 28px "Bricolage Grotesque", sans-serif; letter-spacing: .02em; } .mark b { color: var(--pink); }
header .tag { font: 700 12px "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--grape); } header .grow { flex: 1; }
button, .btn { font: 600 14px Inter, sans-serif; border: 0; border-radius: 999px; padding: 10px 16px; background: var(--navy); color: #fff; cursor: pointer; } button.ghost { background: #fff3d6; color: var(--text); }
h2 { font: 700 13px "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 28px 0 10px; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.card { background: var(--panel); border-radius: 20px; padding: 16px 18px; box-shadow: 0 1px 0 var(--line); }
.stat b { display: block; font: 800 40px/1 "Bricolage Grotesque", sans-serif; letter-spacing: -.03em; } .stat span { display: block; margin-top: 6px; font-weight: 600; } .stat small { display: block; color: var(--muted); margin-top: 2px; }
.grid.big { grid-template-columns: repeat(3, 1fr); gap: 14px; } .grid.big .card { padding: 24px 26px; border-radius: 26px; } .grid.big .stat b { font-size: 76px; } .grid.big .stat span { font-size: 21px; margin-top: 10px; } .grid.big .stat small { font-size: 16px; margin-top: 6px; line-height: 1.4; } .grid.big .stat.lime b { font-size: 58px; line-height: 76px; }
@media (max-width: 900px) { .grid.big { grid-template-columns: repeat(2, 1fr); } .grid.big .stat b { font-size: 56px; } .grid.big .stat.lime b { font-size: 42px; line-height: 56px; } .grid.big .stat span { font-size: 18px; } } @media (max-width: 520px) { .grid.big { grid-template-columns: 1fr 1fr; gap: 10px; } .grid.big .card { padding: 16px; } .grid.big .stat b { font-size: 44px; } .grid.big .stat.lime b { font-size: 32px; line-height: 44px; } .grid.big .stat span { font-size: 16px; } .grid.big .stat small { font-size: 13px; } }
.stat.sun { background: var(--sun); } .stat.navy { background: var(--navy); color: #fff; } .stat.navy small { color: rgba(255,255,255,.7); } .stat.lime { background: var(--lime); } .stat.lime b { font-size: 32px; line-height: 40px; } .stat.grape { background: var(--grape); color: #fff; } .stat.grape small { color: rgba(255,255,255,.8); }
.up { color: #0a8a4a; font-weight: 700; } .down { color: #c2264b; font-weight: 700; } .navy .up, .grape .up { color: var(--lime); }
.chartcard .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 14px; } .chartcard .sum { font-size: 17px; font-weight: 600; } .chartcard .sum b { font: 800 26px "Bricolage Grotesque", sans-serif; margin-right: 4px; } .chartcard .sum.p b { color: var(--pink); } .chartcard .sum.n b { color: var(--grape); }
.seg { margin-left: auto; display: inline-flex; background: #fff3d6; border-radius: 999px; padding: 4px; } .seg button { background: transparent; color: var(--text); padding: 7px 14px; } .seg button.on { background: var(--navy); color: #fff; }
.plot { position: relative; height: 300px; margin: 6px 0 0 34px; border-bottom: 2px solid var(--text); } .plot .gl { position: absolute; left: 0; right: 0; border-top: 1px dashed #e6dcc0; } .plot .gl span { position: absolute; left: -34px; top: -9px; width: 28px; text-align: right; font: 500 12px "JetBrains Mono", monospace; color: var(--muted); }
.bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 6px; padding: 0 4px; } .bars .col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; min-width: 0; } .bars .bar { flex: none; }
.bars .v { font: 700 13px "JetBrains Mono", monospace; margin-bottom: 4px; } .bars .v.zero { color: #c9bfa4; } .bars .bar { width: 100%; max-width: 46px; border-radius: 8px 8px 0 0; background: var(--grape); display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; min-height: 3px; } .bars .bar i { display: block; background: var(--pink); } .bars .col.today .bar { outline: 3px solid var(--sun); outline-offset: 2px; }
.bars .col:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 4px); background: var(--navy); color: #fff; font-size: 13px; padding: 6px 10px; border-radius: 10px; white-space: nowrap; z-index: 3; }
.xl { display: flex; gap: 6px; padding: 8px 4px 0; margin-left: 34px; } .xl span { flex: 1; min-width: 0; text-align: center; font: 500 11.5px "JetBrains Mono", monospace; color: var(--muted); line-height: 1.25; } .xl span b { display: block; color: var(--text); font-weight: 700; } .xl span.wk { color: var(--pink); }
.legend { font-size: 14px; color: var(--muted); margin: 0; } .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin: 0 6px 0 0; vertical-align: -1px; } .legend span { margin-right: 16px; }
.funnel .row { display: grid; grid-template-columns: 190px 1fr 90px; gap: 10px; align-items: center; margin: 8px 0; font-weight: 600; } .funnel .bar { height: 26px; border-radius: 8px; background: #fff3d6; overflow: hidden; } .funnel .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sun), var(--pink)); border-radius: 8px; } .funnel .n { text-align: right; font-family: "JetBrains Mono", monospace; }
table { width: 100%; border-collapse: collapse; font-size: 14px; } th { text-align: left; font: 700 11px "JetBrains Mono", monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; } td { padding: 10px; border-top: 1px solid #f4ead0; vertical-align: top; } .tablewrap { overflow-x: auto; }
.pill { display: inline-block; font: 700 11px "JetBrains Mono", monospace; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; background: #eee; } .pill.paid { background: var(--pink); color: #fff; } .pill.code { background: var(--sky); } .pill.none { background: #f1ecdf; color: var(--muted); } .pill.home { background: var(--lime); }
.note { color: var(--muted); font-size: 14px; } form { display: grid; gap: 10px; max-width: 340px; } input { font: 500 16px Inter, sans-serif; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--line); background: #fff; }
.err { background: #ffe1e8; color: #8a1230; border-radius: 14px; padding: 12px 14px; } @media (max-width: 600px) { .funnel .row { grid-template-columns: 120px 1fr 70px; font-size: 14px; } .stat b { font-size: 34px; } }
</style></head>
<body><div class="wrap">
<header><span class="mark">FU<b>£</b>L</span><span class="tag">owner</span><span class="grow"></span><span class="note" id="stamp"></span><button class="ghost" id="refresh" hidden>Refresh</button><button class="ghost" id="signout" hidden>Sign out</button></header>
<div id="main"><p class="note">Loading…</p></div>
</div>
<script type="module">
import { CONFIG } from './config.js';
const PRICE = parseFloat((CONFIG.PRICE_LABEL || '£4.99').replace(/[^\d.]/g, '')) || 4.99;
const $ = (id) => document.getElementById(id); const main = $('main');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
const db = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });   // same sign-in as the app on this device
const ago = (iso) => { if (!iso) return 'never'; const s = (Date.now() - new Date(iso)) / 1000; if (s < 90) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min ago'; if (s < 86400) return Math.round(s / 3600) + ' h ago'; if (s < 86400 * 14) return Math.round(s / 86400) + ' d ago'; return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }); };
const trend = (now, prev) => prev === 0 && now === 0 ? '' : prev === 0 ? `<span class="up">new</span>` : now >= prev ? `<span class="up">▲ ${Math.round((now - prev) / prev * 100)}%</span>` : `<span class="down">▼ ${Math.round((prev - now) / prev * 100)}%</span>`;
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0) + '%';

function signInForm(msg) {
  main.innerHTML = `<div class="card" style="max-width:420px"><h2 style="margin-top:0">Sign in</h2><p class="note">Use the same email and password as the app.</p>${msg ? `<p class="err">${esc(msg)}</p>` : ''}<form id="f"><input name="email" type="email" required placeholder="Email" autocomplete="email"><input name="password" type="password" required placeholder="Password" autocomplete="current-password"><button>Sign in</button></form></div>`;
  $('f').addEventListener('submit', async (e) => { e.preventDefault(); const fd = new FormData(e.target); const { error } = await db.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('password') }); if (error) signInForm(error.message); else load(); });
}

// owner.html?demo shows made-up numbers, clearly labelled, so the layout can be seen without signing in
const DEMO = new URLSearchParams(location.search).has('demo');
function demoData() {
  const today = new Date(); const by_day = [...Array(30)].map((_, i) => { const d = new Date(today); d.setDate(d.getDate() - (29 - i)); const s = Math.max(0, Math.round(2 + i / 5 + 3 * Math.sin(i / 2.2))); return { day: d.toISOString().slice(0, 10), signups: s, paid: Math.round(s * 0.4), active: s + 3 }; });
  const mk = (h, email, plan, source, w, sh, home, device) => ({ email, created_at: new Date(Date.now() - h * 3600e3).toISOString(), last_sign_in_at: new Date(Date.now() - h * 1800e3).toISOString(), last_active: new Date(Date.now() - h * 900e3).toISOString(), plan, source, weeks_planned: w, shops_done: sh, on_home_screen: home, device });
  return { generated_at: new Date().toISOString(), users: { total: 148, last_24h: 9, last_7d: 41, last_30d: 148, prev_7d: 28 }, access: { with_access: 71, paid: 58, paid_7d: 19, paid_prev_7d: 12, by_code: 11, other: 2, signed_up_no_access: 77 },
    activity: { active_24h: 23, active_7d: 64, active_30d: 97, planned_a_week: 63, planned_2_plus: 31, finished_a_shop: 38, on_home_screen: 44, iphone: 52, android: 14 }, goals: { build: 39, lean: 18, lose: 9, eatwell: 5 }, by_day,
    recent: [mk(2, 'sam@example.ac.uk', 'lifetime', 'stripe:cs_x', 1, 0, true, 'ios'), mk(5, 'jess@example.ac.uk', null, null, 0, 0, false, null), mk(9, 'tom@example.com', 'year', 'code:MATES2026', 2, 1, true, 'android'), mk(30, 'ali@example.ac.uk', 'lifetime', 'stripe:cs_y', 3, 2, true, 'ios')],
    codes: [{ code: 'FOUNDER-CAM', plan: 'founder', uses: 1, max_uses: 1 }, { code: 'MATES2026', plan: 'year', uses: 10, max_uses: 25 }] };
}
async function load() {
  if (DEMO) { $('stamp').textContent = ''; return draw(demoData(), true); }
  const { data: sess } = await db.auth.getSession();
  $('signout').hidden = $('refresh').hidden = !sess.session;
  if (!sess.session) return signInForm();
  main.innerHTML = '<p class="note">Loading…</p>';
  const { data: d, error } = await db.rpc('owner_stats');
  if (error) { main.innerHTML = `<div class="card"><p class="err">${/not allowed/i.test(error.message) ? `This account (${esc(sess.session.user.email)}) isn't set up as the owner.` : /owner_stats|schema cache|function/i.test(error.message) ? 'The dashboard hasn\'t been switched on in the database yet: run supabase/owner-dashboard.sql once in Supabase → SQL Editor.' : esc(error.message)}</p></div>`; return; }
  draw(d, false);
}
function draw(d, demo) {
  const u = d.users, a = d.access, v = d.activity; const days = d.by_day || []; const max = Math.max(1, ...days.map((x) => x.signups));
  $('stamp').textContent = 'Updated ' + new Date(d.generated_at).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  const stat = (cls, n, label, small) => `<div class="card stat ${cls}"><b>${n}</b><span>${label}</span>${small ? `<small>${small}</small>` : ''}</div>`;
  const fr = (label, n, of) => `<div class="row"><span>${label}</span><div class="bar"><i style="width:${Math.max(2, Math.round((n / Math.max(1, of)) * 100))}%"></i></div><span class="n">${n} · ${pct(n, of)}</span></div>`;
  main.innerHTML = `${demo ? '<p class="err" style="background:#fff3d6;color:#4a3300"><b>Sample data.</b> These numbers are made up to show the layout. Open this page without “?demo” and sign in for the real ones.</p>' : ''}
  <h2 style="margin-top:4px">Right now</h2><div class="grid big">
    ${stat('navy', u.total, 'accounts', `${u.last_24h} in the last 24 hours`)}
    ${stat('sun', u.last_7d, 'new this week', `${trend(u.last_7d, u.prev_7d)} vs the week before (${u.prev_7d})`)}
    ${stat('', a.paid, 'paid', `${a.paid_7d} this week ${trend(a.paid_7d, a.paid_prev_7d)}`)}
    ${stat('lime', '£' + (a.paid * PRICE).toFixed(2), 'taken so far', `${a.paid} × £${PRICE.toFixed(2)}, before Stripe's fees`)}
    ${stat('grape', v.active_7d, 'active this week', `${v.active_24h} today · ${v.active_30d} this month`)}
    ${stat('', pct(a.paid, u.total), 'sign-up → paid', `${a.signed_up_no_access} signed up and haven't paid or used a code`)}
  </div>
  <h2>New accounts and sales, day by day</h2><div class="card chartcard" id="chartcard"></div>
  <h2>Where people drop off</h2><div class="card funnel">
    ${fr('Made an account', u.total, u.total)}${fr('Got access (paid or code)', a.with_access, u.total)}${fr('Planned a week', v.planned_a_week, u.total)}${fr('Finished a shop', v.finished_a_shop, u.total)}${fr('Planned a 2nd week', v.planned_2_plus, u.total)}
    <p class="note" style="margin:10px 0 0">The biggest gap between two bars is the thing to fix next.</p></div>
  <h2>How they got in, and how they use it</h2><div class="grid">
    ${stat('', a.paid, 'paid through Stripe')}${stat('', a.by_code, 'used a code', (d.codes || []).map((c) => `${esc(c.code)} ${c.uses}/${c.max_uses}`).join(' · '))}${stat('', a.other, 'given access by hand')}
    ${stat('', v.on_home_screen, 'on their home screen', `counted from v66 on · iPhone ${v.iphone} · Android ${v.android}`)}
    ${stat('', Object.entries(d.goals || {}).sort((x, y) => y[1] - x[1]).map(([g, n]) => `${esc(g)} ${n}`).join(' · ') || '—', 'goals picked').replace('<b>', '<b style="font-size:20px;line-height:1.25">')}
  </div>
  <h2>Newest accounts</h2><div class="card tablewrap"><table><thead><tr><th>Email</th><th>Joined</th><th>Access</th><th>Last active</th><th>Weeks</th><th>Shops</th><th></th></tr></thead><tbody>
    ${(d.recent || []).map((r) => `<tr><td>${esc(r.email)}</td><td>${ago(r.created_at)}</td><td>${/^stripe:/.test(r.source || '') ? '<span class="pill paid">paid</span>' : /^code:/.test(r.source || '') ? `<span class="pill code">${esc(r.source.slice(5))}</span>` : r.plan ? `<span class="pill">${esc(r.plan)}</span>` : '<span class="pill none">not yet</span>'}</td><td>${ago(r.last_active || r.last_sign_in_at)}</td><td>${r.weeks_planned}</td><td>${r.shops_done}</td><td>${r.on_home_screen ? `<span class="pill home">${esc(r.device || 'home screen')}</span>` : ''}</td></tr>`).join('') || '<tr><td colspan="7" class="note">Nobody yet.</td></tr>'}
  </tbody></table></div>
  <p class="note" style="margin-top:18px">Not counted here: visits to the website and money after Stripe's fees. Stripe's own dashboard has the exact payouts.</p>`;
  DAYS = days; chart();
  main.insertAdjacentHTML('beforeend', '<div id="growth"><p class="note">Loading the free-week funnel…</p></div>');
  loadGrowth(demo);
}
// ---------- since v81: the free week (no account needed), where people come from, mates and creators (supabase/growth.sql) ----------
const STEPS = [['visit', 'Visited the website'], ['open', 'Opened the app'], ['setup', 'Started set-up'], ['planned', 'Planned a week (7+ meals)'], ['account', 'Made an account'], ['paid', 'Paid £4.99'], ['home', 'On their home screen'], ['shared', 'Shared their week or link']];
const gbp = (p) => '£' + (p / 100).toFixed(2);
function demoGrowth() {
  return { days: 30, steps: { visit: 412, open: 233, setup: 171, planned: 96, account: 31, paid: 14, home: 58, shared: 22 }, planned_ever: 96,
    by_source: [{ source: 'tt', visits: 210, opened: 120, setup: 88, planned: 51, accounts: 15, paid: 6, home: 30, shared: 9 }, { source: 'ig', visits: 120, opened: 66, setup: 50, planned: 27, accounts: 9, paid: 5, home: 17, shared: 8 }, { source: 'rugby', visits: 22, opened: 21, setup: 20, planned: 14, accounts: 6, paid: 3, home: 9, shared: 5 }, { source: 'direct', visits: 60, opened: 26, setup: 13, planned: 4, accounts: 1, paid: 0, home: 2, shared: 0 }],
    creators: [{ code: 'JESS', name: 'Jess (sample)', handle: '@sample', email: 'sample@example.com', active: true, commission_pence: 100, promo_code: 'FREE-JESS', visits: 140, planned: 33, accounts: 9, sales: 6, on_hold_pence: 200, payable_pence: 300, paid_pence: 100, secret: 'demo' }],
    mates: { codes: 40, with_a_mate: 12, unlocked: 3, claimed: 2 } };
}
async function loadGrowth(demo) {
  const box = $('growth'); let g;
  if (demo) g = demoGrowth();
  else { const { data, error } = await db.rpc('owner_growth', { p_days: GDAYS }); if (error) { box.innerHTML = `<h2>The free week</h2><div class="card"><p class="note">${/owner_growth|schema cache|function/i.test(error.message) ? 'Not switched on yet: run <b>supabase/growth.sql</b> once in Supabase → SQL Editor.' : esc(error.message)}</p></div>`; return; } g = data; }
  const st = g.steps || {}; const top = Math.max(1, st.visit || 0, st.open || 0);
  const fr = (label, n, of) => `<div class="row"><span>${label}</span><div class="bar"><i style="width:${Math.max(2, Math.round(((n || 0) / top) * 100))}%"></i></div><span class="n">${n || 0}${of && label !== STEPS[0][1] ? ' · ' + pct(n || 0, of) : ''}</span></div>`; // bar: share of the top step; % : of the step above
  const src = (g.by_source || []);
  box.innerHTML = `<h2>The free week: every phone, no account needed <span class="seg" style="margin-left:10px;vertical-align:middle">${[7, 30, 90].map((n) => `<button data-gd="${n}" class="${GDAYS === n ? 'on' : ''}">${n} days</button>`).join('')}</span></h2>
  <div class="grid big">
    <div class="card stat sun"><b>${g.planned_ever || 0}</b><span>planned a week, ever</span><small>the goal: 100 by Sun 15 Nov</small></div>
    <div class="card stat"><b>${st.open || 0}</b><span>opened the app</span><small>last ${g.days} days</small></div>
    <div class="card stat navy"><b>${st.paid || 0}</b><span>paid</span><small>last ${g.days} days · ${pct(st.paid || 0, st.planned || 0)} of those who planned</small></div>
  </div>
  <div class="card funnel" style="margin-top:12px">${STEPS.map(([k, l], i) => fr(l, st[k], i === 0 ? top : (k === 'home' || k === 'shared' ? st.open : st[STEPS[i - 1][0]] || 0))).join('')}
    <p class="note" style="margin:10px 0 0">Each step is counted once per phone, anonymously. Percentages are of the step above (home screen and shared: of everyone who opened the app). The biggest drop is the thing to fix next.</p></div>
  <h2>Where they came from</h2><div class="card tablewrap"><table><thead><tr><th>Source</th><th>Visited</th><th>Opened</th><th>Set-up</th><th>Planned</th><th>Account</th><th>Paid</th></tr></thead><tbody>
    ${src.map((x) => `<tr><td><b>${esc(x.source)}</b></td><td>${x.visits}</td><td>${x.opened}</td><td>${x.setup}</td><td><b>${x.planned}</b></td><td>${x.accounts}</td><td>${x.paid}</td></tr>`).join('') || '<tr><td colspan="7" class="note">Nothing yet.</td></tr>'}</tbody></table>
    <p class="note" style="margin:10px 0 0">Tag your links so this fills in: <b>thefuelapp.github.io/?r=tt</b> in the TikTok bio, <b>?r=ig</b> on Instagram, <b>?r=rugby</b> in the squad chat, <b>?r=poster</b> on QR posters. "code" = came with a mate's or creator's code and no tag.</p></div>
  <h2>Bring 3 mates</h2><div class="grid">
    <div class="card stat"><b>${g.mates?.codes || 0}</b><span>people with a link</span></div><div class="card stat"><b>${g.mates?.with_a_mate || 0}</b><span>got at least 1 mate planning</span></div><div class="card stat lime"><b>${g.mates?.unlocked || 0}</b><span>reached 3: free for life</span><small>${g.mates?.claimed || 0} saved it to an account</small></div></div>
  <h2>Creators</h2><div class="card tablewrap"><table><thead><tr><th>Creator</th><th>Code</th><th>Opened</th><th>Planned</th><th>Sales</th><th>On hold</th><th>To pay</th><th>Paid</th><th></th></tr></thead><tbody>
    ${(g.creators || []).map((c) => `<tr><td><b>${esc(c.name || '')}</b><br><span class="note">${esc(c.handle || '')} ${c.email ? '· ' + esc(c.email) : ''}${c.active ? '' : ' · <b>paused</b>'}</span></td><td><span class="pill code">${esc(c.code)}</span><br><span class="note">${gbp(c.commission_pence)} a sale</span></td><td>${c.visits}</td><td>${c.planned}</td><td><b>${c.sales}</b></td><td>${gbp(c.on_hold_pence)}</td><td><b>${gbp(c.payable_pence)}</b></td><td>${gbp(c.paid_pence)}</td>
      <td style="white-space:nowrap"><button class="ghost" data-copy="https://thefuelapp.github.io/?c=${esc(c.code)}">Copy link</button> <button class="ghost" data-copy="https://thefuelapp.github.io/app/partner.html#${esc(c.code)}.${esc(c.secret)}">Copy their dashboard</button> ${c.payable_pence ? `<button data-paid="${esc(c.code)}" data-amt="${c.payable_pence}">I've paid ${gbp(c.payable_pence)}</button>` : ''} <button class="ghost" data-toggle="${esc(c.code)}" data-active="${c.active ? 1 : 0}" data-comm="${c.commission_pence}">${c.active ? 'Pause' : 'Resume'}</button></td></tr>`).join('') || '<tr><td colspan="9" class="note">No creators yet. Add one below.</td></tr>'}</tbody></table>
    <p class="note" style="margin:10px 0 0">A sale is held 14 days (refunds), then it's "to pay". Pay them by bank transfer, then press "I've paid". Their dashboard link shows them the same numbers, never who bought.</p></div>
  <div class="card"><b>Add a creator</b><p class="note" style="margin:4px 0 10px">They get a link (thefuelapp.github.io/?c=CODE), a free lifetime code (FREE-CODE) and their own dashboard.</p>
    <form id="addc" style="max-width:none;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"><input name="name" placeholder="Name" required><input name="handle" placeholder="@handle"><input name="email" type="email" placeholder="Email (for paying them)"><input name="code" placeholder="CODE, e.g. JESS" required pattern="[A-Za-z0-9]{3,20}" style="text-transform:uppercase"><label class="note" style="display:flex;align-items:center;gap:8px;white-space:nowrap">£ a sale<input name="pounds" type="number" step="0.01" min="0" max="4.99" value="1.00" title="Commission per sale, £ (£1 = 20% of £4.99; 50p = 10%)" style="width:100%"></label><button type="submit">Add creator</button></form><div id="addmsg"></div></div>`;
  box.querySelectorAll('[data-gd]').forEach((b) => { b.onclick = () => { GDAYS = +b.dataset.gd; loadGrowth(demo); }; });
  box.querySelectorAll('[data-copy]').forEach((b) => { b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); const t = b.textContent; b.textContent = 'Copied'; setTimeout(() => { b.textContent = t; }, 1200); } catch { b.insertAdjacentHTML('afterend', `<div class="note" style="word-break:break-all">${esc(b.dataset.copy)}</div>`); } }; });
  if (demo) return;
  const fail = (m) => { const el = $('addmsg'); if (el) el.innerHTML = `<p class="err">${esc(m)}</p>`; };
  // "I've paid" asks twice (tap, then "Sure? Tap again") so a stray tap can't mark money as sent.
  box.querySelectorAll('[data-paid]').forEach((b) => { b.onclick = async () => { if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = `Sent ${gbp(+b.dataset.amt)}? Tap again`; setTimeout(() => { delete b.dataset.sure; b.textContent = `I've paid ${gbp(+b.dataset.amt)}`; }, 4000); return; } const { error } = await db.rpc('owner_mark_paid', { p_code: b.dataset.paid }); if (error) fail(error.message); else loadGrowth(false); }; });
  box.querySelectorAll('[data-toggle]').forEach((b) => { b.onclick = async () => { const { error } = await db.rpc('owner_update_creator', { p_code: b.dataset.toggle, p_active: b.dataset.active !== '1', p_commission_pence: +b.dataset.comm, p_note: null }); if (error) fail(error.message); else loadGrowth(false); }; });
  $('addc').onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target); const msg = $('addmsg');
    const { data, error } = await db.rpc('owner_add_creator', { p_name: f.get('name'), p_handle: f.get('handle'), p_email: f.get('email'), p_code: f.get('code'), p_commission_pence: Math.round(+f.get('pounds') * 100), p_note: null });
    if (error || !data?.ok) { msg.innerHTML = `<p class="err">${esc(error?.message || data?.error || 'Not added')}</p>`; return; }
    const who = f.get('name'); await loadGrowth(false); const box2 = $('addmsg');
    const link = `https://thefuelapp.github.io/?c=${data.code}`, dash = `https://thefuelapp.github.io/app/partner.html#${data.code}.${data.secret}`;
    box2.innerHTML = `<div class="card" style="background:#fff3d6;margin-top:10px"><b>Added. Send ${esc(who)} these three things:</b><ol><li>Their link: <b>${esc(link)}</b></li><li>Their free lifetime code: <b>${esc(data.promo)}</b></li><li>Their dashboard: <b style="word-break:break-all">${esc(dash)}</b></li></ol><button class="ghost" id="copyall">Copy all three</button></div>`;
    $('copyall').onclick = () => navigator.clipboard.writeText(`Your FU£L link: ${link}\nYour free lifetime code: ${data.promo} (in the app: Settings → Account → Save to an account → Have a code?)\nYour dashboard (live numbers and earnings): ${dash}\nPlease label posts about FU£L #ad.`).then(() => { $('copyall').textContent = 'Copied'; });
    box2.scrollIntoView({ block: 'center' });
  };
}
let GDAYS = 30;
let RANGE = 14, DAYS = [];
function chart() {
  const days = DAYS.slice(-RANGE); const top = Math.max(1, ...days.map((x) => x.signups)); const step = top <= 5 ? 1 : top <= 10 ? 2 : top <= 25 ? 5 : top <= 50 ? 10 : Math.ceil(top / 5 / 10) * 10; const max = Math.ceil((top * 1.12) / step) * step;   // headroom, so the number above the tallest bar stays inside the plot
  const lines = []; for (let v = 0; v <= max; v += step) lines.push(v);
  const sumN = days.reduce((t, x) => t + x.signups, 0), sumP = days.reduce((t, x) => t + x.paid, 0);
  const fmt = (iso, o) => new Date(iso + 'T12:00:00').toLocaleDateString('en-GB', o);
  $('chartcard').innerHTML = `<div class="top"><span class="sum n"><b>${sumN}</b>new accounts</span><span class="sum p"><b>${sumP}</b>paid</span><span class="sum"><b>${sumN ? Math.round(sumP / sumN * 100) : 0}%</b>of new accounts paid</span>
      <span class="seg"><button data-r="7" class="${RANGE === 7 ? 'on' : ''}">7 days</button><button data-r="14" class="${RANGE === 14 ? 'on' : ''}">14 days</button><button data-r="30" class="${RANGE === 30 ? 'on' : ''}">30 days</button></span></div>
    <p class="legend"><span><i style="background:var(--grape)"></i>new accounts that day (the number on top)</span><span><i style="background:var(--pink)"></i>how many of them paid</span><span><i style="background:var(--sun)"></i>today</span></p>
    <div class="plot">${lines.map((v) => `<div class="gl" style="bottom:${(v / max) * 100}%"><span>${v}</span></div>`).join('')}
      <div class="bars">${days.map((x, i) => `<div class="col ${i === days.length - 1 ? 'today' : ''}" data-tip="${fmt(x.day, { weekday: 'long', day: 'numeric', month: 'short' })}: ${x.signups} new · ${x.paid} paid · ${x.active} active"><span class="v ${x.signups ? '' : 'zero'}">${x.signups}</span><div class="bar" style="height:${(x.signups / max) * 100}%"><i style="height:${x.signups ? (x.paid / x.signups) * 100 : 0}%"></i></div></div>`).join('')}</div></div>
    <div class="xl">${days.map((x, i) => { const d = new Date(x.day + 'T12:00:00'); const show = RANGE <= 14 || i === days.length - 1 || d.getDay() === 1; const wk = d.getDay() === 0 || d.getDay() === 6; return `<span class="${wk ? 'wk' : ''}">${show ? `<b>${d.getDate()}</b>${RANGE <= 14 ? fmt(x.day, { weekday: 'short' }) : fmt(x.day, { month: 'short' })}` : ''}</span>`; }).join('')}</div>`;
  $('chartcard').querySelectorAll('[data-r]').forEach((b) => { b.onclick = () => { RANGE = +b.dataset.r; chart(); }; });
}
$('refresh').onclick = load; $('signout').onclick = async () => { await db.auth.signOut(); load(); };
load();
</script></body></html>
